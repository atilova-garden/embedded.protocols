name: Deploy Docs

on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true

jobs:
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Buf
        uses: bufbuild/buf-action@v1
        with:
          setup_only: true

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Install dependencies
        run: uv sync

      - name: Generate docs
        env:
          DOCS_REPOSITORY_BRANCH: ${{ inputs.tag }}
        run: make ci-docs

      - name: Configure git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Setup gh-pages worktree
        run: |
          if git fetch origin gh-pages:gh-pages 2>/dev/null; then
            git worktree add ./gh-pages gh-pages
          else
            git worktree add --orphan -b gh-pages ./gh-pages
            cd gh-pages
            git commit --allow-empty -m "init: initialize gh-pages"
            cd ..
          fi

      - name: Deploy version
        env:
          TAG: ${{ inputs.tag }}
        run: |
          mkdir -p gh-pages/$TAG
          cp -r gen/docs/. gh-pages/$TAG/
          rm -rf gh-pages/latest
          mkdir -p gh-pages/latest
          cp -r gen/docs/. gh-pages/latest/

      - name: Generate version index
        run: python .github/scripts/generate_index.py ./gh-pages/

      - name: Commit and push
        env:
          TAG: ${{ inputs.tag }}
        run: |
          cd gh-pages
          git add -A
          git commit -m "docs: deploy $TAG"
          git push origin gh-pages
