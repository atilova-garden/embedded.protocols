name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches:
      - master
      - 'feature/**'
      - 'bugfix/**'
      - 'chore/**'

jobs:
  pre-setup:
    name: Pre Setup
    uses: ./.github/workflows/pre-setup.yaml
    with:
      branchRef: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
      pushCompareBranch: ${{ github.event_name == 'push' && 'master' || '' }}

  ci:
    name: Lint, Format, Generate Docs
    needs: pre-setup
    if: needs.pre-setup.outputs.shouldSkipBuild != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Buf
        uses: bufbuild/buf-action@v1
        with:
          setup_only: true

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Install dependencies
        run: uv sync

      - name: Lint & Format
        run: make ci

      # TODO: add breaking change validation against the latest released tag
      #   run: make breaking

      - name: Generate Docs
        run: make ci-docs

  release:
    name: Release
    needs: [pre-setup, ci]
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Create and push tag
        run: |
          git tag ${{ needs.pre-setup.outputs.appTag }}
          git push origin ${{ needs.pre-setup.outputs.appTag }}

  deploy-docs:
    name: Deploy Docs
    needs: [pre-setup, release]
    if: github.ref == 'refs/heads/master'
    uses: ./.github/workflows/deploy-docs.yaml
    with:
      tag: ${{ needs.pre-setup.outputs.appTag }}
    permissions:
      contents: write
